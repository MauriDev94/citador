[project]
name = "citador"
version = "0.1.0"
description = "Asistente RAG de documentación técnica con citas obligatorias"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

# ─────────────────────────────────────────────
# ruff — linter Y formateador (reemplaza flake8, isort, black)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: errores de estilo
    "F",    # pyflakes: imports sin usar, variables no definidas
    "I",    # isort: orden de imports
    "UP",   # pyupgrade: sintaxis moderna de Python
    "B",    # flake8-bugbear: trampas comunes que no son errores de sintaxis
    "SIM",  # flake8-simplify: código que se puede escribir más simple
    "RUF",  # reglas propias de ruff
]

# ─────────────────────────────────────────────
# mypy — verificación estática de tipos
# ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# ─────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: tests que requieren servicios externos (DB, red)",
]

[tool.coverage.run]
source = ["app"]
# Cobertura de RAMA, no de línea. La de línea miente: un test que recorre un
# `if` sin probar la rama falsa reporta 100% de línea y 50% de rama.
branch = true

[tool.coverage.report]
# Ojo: este 80 venía de medir LÍNEA. Con `branch = true` el número real baja y
# todavía no está medido — la suite completa necesita Postgres. El primer run
# del CI lo va a decir; ajustar entonces con el dato, no antes.
# El estándar del harness apunta a 85 de rama.
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
